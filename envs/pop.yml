# pop 功能域环境|pop domain environment
# gctb 为自编译二进制, 不进 conda|
# 创建|Create: mamba env create -f envs/pop.yml
# 由求解预检验证(2026-08-16, 全部可解)|Validated by solver preflight
name: pop
channels:
  - conda-forge
  - bioconda
dependencies:
  - plink
  - vcftools
  - admixture
  - treemix
  - pixy
  - poplddecay
  - fastani
  # EasyHap: 纯 Python pip 包(上游 Guangqi-He/EasyHap v1.0), 本地 pip install --no-deps 安装
  # 注意|Note: 上游 v1.0 pyproject.toml 缺 packages 配置(flat-layout 会把 images/ 误认成包致构建失败),
  # 安装前需在本地克隆补两行: [tool.setuptools] / packages = ["easyhap"]
  - pip:
    - easyhap @ git+https://github.com/Guangqi-He/EasyHap.git
