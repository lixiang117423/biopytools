# 文档站点自动构建并发布到 GitHub Pages|Auto-build docs site and deploy to GitHub Pages
# 触发:docs/mkdocs.yml/overrides/workflow 本身有变更时;也可手动触发
name: Deploy Docs to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'mkdocs.yml'
      - 'overrides/**'
      - '.github/workflows/deploy-docs.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码|Checkout
        uses: actions/checkout@v4

      - name: 安装Python|Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: 安装构建依赖|Install deps
        run: pip install mkdocs-material

      - name: 构建站点|Build site
        run: mkdocs build

      - name: 上传Pages产物|Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: 部署到Pages|Deploy
        id: deployment
        uses: actions/deploy-pages@v4
