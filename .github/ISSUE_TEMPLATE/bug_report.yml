name: Bug report
description: Report a reproducible problem in BioPyTools
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Remove private paths, credentials, and unpublished data before submitting.
  - type: input
    id: version
    attributes:
      label: BioPyTools version
      description: Output of `biopytools --version`
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version and operating system
    validations:
      required: true
  - type: textarea
    id: command
    attributes:
      label: Command and input description
      description: Include the full command and a minimal de-identified input description.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior and logs
      description: Include the exit code and relevant lines from `99_logs/`.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest command or synthetic dataset that reproduces the issue.
  - type: checkboxes
    id: checks
    attributes:
      label: Checks
      options:
        - label: I searched existing issues.
          required: true
        - label: I removed private or sensitive information.
          required: true
