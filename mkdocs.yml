# BioPyTools 模块文档站点配置|BioPyTools Module Docs Site Config
# 用法|Usage:
#   venv/bin/mkdocs build            # 构建到 site/
#   venv/bin/mkdocs serve            # 本地预览 http://127.0.0.1:8000
# 产物 site/ 已 gitignore,不提交;GitHub Pages 由 CI 构建发布
site_name: BioPyTools 模块文档
site_description: 生物信息工具模块使用文档|Bioinformatics tool module docs
site_url: https://lixiang117423.github.io/biopytools/
repo_url: https://github.com/lixiang117423/biopytools
repo_name: lixiang117423/biopytools
edit_uri_template: 'https://github.com/lixiang117423/biopytools/edit/main/docs/{path}'

docs_dir: docs
site_dir: site

theme:
  name: material
  language: zh
  custom_dir: overrides
  logo: assets/logo.svg
  favicon: assets/favicon-32.png
  icon:
    repo: fontawesome/brands/github
  font: false   # 关闭 Google Fonts(国内加载慢/超时),使用系统字体栈(extra.css)
  features:
    - navigation.tabs
    - navigation.top
    - navigation.tracking
    - navigation.instant
    - navigation.instant.prefetch
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.code.annotate
    - content.action.edit
    - content.action.view
  palette:
    # 亮色|Light
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-night
        name: 切换到深色模式
    # 深色|Dark
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: 切换到亮色模式

extra_css:
  - stylesheets/extra.css

plugins:
  - search

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.superfences
  - attr_list
  - md_in_html
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

# 导航:模块按功能域分组,新增模块文档在对应分组登记
# 分组规划见 docs/index.md「模块分类」;后续随文档铺开逐步补全
nav:
  - 首页: index.md
  - 模块文档:
      - 群体遗传:
          - CIM 复合区间作图: cim.md
