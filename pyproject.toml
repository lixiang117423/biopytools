[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "biopytools"
version = "1.72.1"
description = "Bioinformatics tools package with Python."
authors = [{name = "Xiang LI", email = "lixiang117423@gmail.com"}]
requires-python = ">=3.10"
dependencies = [
    "pandas",
    "numpy",
    "pyfastx>=0.8.4",
    "scikit-learn>=1.0.0",
    "matplotlib>=3.5.0",
    "seaborn>=0.11.0",
    "click>=8.0.0",  # 添加Click依赖
    "requests",
]

[project.scripts]
biopytools = "biopytools.cli.main:main"

[project.urls]
Homepage = "https://github.com/lixiang117423/biopytools"
Documentation = "https://lixiang117423.github.io/article/biopytools-readme/"
Repository = "https://github.com/lixiang117423/biopytools.git"
Issues = "https://github.com/lixiang117423/biopytools/issues"

[tool.setuptools.packages.find]
include = ["biopytools*"]

[tool.setuptools.package-data]
"biopytools.interproscan" = ["go_data.json"]

[project.optional-dependencies]
dev = [
    "pytest>=6.0",
    "pytest-cov",
    "black",
    "isort",
    "flake8"
]

docs = [
    "mkdocs",
    "mkdocs-material",
    "mkdocs-mermaid2-plugin"
]

[tool.pytest.ini_options]
# 登录节点默认跳过 e2e(计算节点显式 -m e2e 覆盖)|Skip e2e by default
# on the login node; compute nodes override with an explicit -m e2e
addopts = "-m 'not e2e'"
markers = ["e2e: 计算节点e2e|compute-node end-to-end"]
